name: Build iOS IPA-Debug

on:
  push:
    branches:
      - master # 只要往 master 提交就自动触发
  workflow_dispatch: # 手动触发构建

jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Expo & dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Add expo-dev-client
        run: npx expo install expo-dev-client

      - name: Prebuild and Install CocoaPods
        run: |
          npx expo prebuild --platform ios --clean
          cd ios
          pod install

      - name: Build iOS-Debug from Xcode
        run: |
          RAW_NAME=$(jq -r '.expo.name // .name' app.json)
          if [ "$RAW_NAME" = "null" ] || [ -z "$RAW_NAME" ]; then
            RAW_NAME=$(jq -r .name package.json)
          fi
          SAFE_NAME=$(echo "$RAW_NAME" | sed 's/./\u&/' | tr -cd '[:alnum:]_')

          echo "🚀 开始进行 Xcode 硬件加速编译..."

          # 🌟 核心优化：使用 xcbeautify（如果可用）精简输出，同时注入多核并行编译参数
          xcodebuild \
            -workspace ios/$SAFE_NAME.xcworkspace \
            -scheme $SAFE_NAME \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/$SAFE_NAME.xcarchive \
            -jobs $(sysctl -n hw.ncpu) \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive clean | egrep -v '^(Analysing|Minting|Copy|Process|Generate)'

      - name: Build .app for .ipa
        run: |
          RAW_NAME=$(jq -r '.expo.name // .name' app.json)
          VERSION=$(jq -r .version package.json)
          SAFE_NAME=$(echo $RAW_NAME | tr -cd '[:alnum:]_')

          echo "当前目录: $(pwd)"
          # 1. 稳妥切进 Applications 目录
          cd "$GITHUB_WORKSPACE/build/${SAFE_NAME}.xcarchive/Products/Applications"

          echo "当前打包目录: $(pwd)"
          echo "开始创建 Payload 目录..."
          # 2. 创建标准的 Payload 目录
          mkdir -p Payload
          cp -r "${SAFE_NAME}.app" Payload/

          echo "开始压缩 Payload..."
          # 3. 加上 -q 静默压缩，-r 递归压缩
          zip -qr "${SAFE_NAME}_debug_${VERSION}.ipa" Payload

          echo "开始移动 IPA..."
          # 4. 把成品移到 GitHub 工作区根目录
          mv "${SAFE_NAME}_debug_${VERSION}.ipa" "$GITHUB_WORKSPACE/"

          echo "IPA 已移动到 $GITHUB_WORKSPACE/"

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios_no_sign_debug
          path: ./*.ipa
