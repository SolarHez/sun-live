name: Build Release For iOS & Android

on:
  workflow_dispatch: # 手动触发构建

permissions:
  contents: write

jobs:
  # ==================== JOB 1: 安卓打包 ====================
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prebuild Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Artifact
        run: |
          echo "当前目录结构查看："
          ls -l android/app/build/outputs/apk/release/

          echo "🚀 开始准备 APK Artifact..."
          EXPO_APP_NAME=$(jq -r '.expo.name // .name' app.json)
          VERSION=$(jq -r .version package.json)
          cp android/app/build/outputs/apk/release/*.apk ./${EXPO_APP_NAME}-v${VERSION}-release.apk

      - name: Upload APK to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android_release_apk
          path: ./*.apk

  # ==================== JOB 2: iOS 打包 ====================
  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add expo-dev-client
        run: npx expo install expo-dev-client

      - name: Prebuild and Install CocoaPods
        run: |
          npx expo prebuild --platform ios --clean
          cd ios
          pod install

      - name: Get Expo Info
        id: expo_info
        run: |
          EXPO_APP_NAME=$(jq -r '.expo.name // .name' app.json)
          VERSION=$(jq -r .version package.json)
          echo "EXPO_APP_NAME=$EXPO_APP_NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build iOS-Release from Xcode
        run: |
          EXPO_APP_NAME=${{ steps.expo_info.outputs.EXPO_APP_NAME }}

          echo "🚀 开始进行 Xcode 硬件加速编译..."
          echo "📦 Expo包名: $EXPO_APP_NAME "

          xcodebuild \
            -workspace ios/${EXPO_APP_NAME}.xcworkspace \
            -scheme ${EXPO_APP_NAME} \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/${EXPO_APP_NAME}.xcarchive \
            -jobs $(sysctl -n hw.ncpu) \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive clean | egrep -v '^(Analysing|Minting|Copy|Process|Generate)'

      - name: Build .app for .ipa
        run: |
          EXPO_APP_NAME=${{ steps.expo_info.outputs.EXPO_APP_NAME }}
          VERSION=${{ steps.expo_info.outputs.VERSION }}

          echo "🚀 开始进行 .app 打包..."
          echo "📦 Expo包名: $EXPO_APP_NAME "
          echo "🦄 Expo版本: $VERSION "

          echo "当前目录: $(pwd)"
          # 1. 稳妥切进 Applications 目录
          cd "$GITHUB_WORKSPACE/build/${EXPO_APP_NAME}.xcarchive/Products/Applications"

          echo "当前打包目录: $(pwd)"
          echo "开始创建 Payload 目录..."
          # 2. 创建标准的 Payload 目录
          mkdir -p Payload
          cp -r "${EXPO_APP_NAME}.app" Payload/

          echo "开始压缩 Payload..."
          # 3. 加上 -q 静默压缩，-r 递归压缩
          zip -qr "${EXPO_APP_NAME}_release_${VERSION}.ipa" Payload

          echo "开始移动 IPA..."
          # 4. 把成品移到 GitHub 工作区根目录
          mv "${EXPO_APP_NAME}_release_${VERSION}.ipa" "$GITHUB_WORKSPACE/"

          echo "IPA 已移动到 $GITHUB_WORKSPACE/"

      - name: Upload IPA to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios_release_no_sign
          path: ./*.ipa

  # ==================== JOB 3: 统一发布到 Release ====================
  publish-release:
    runs-on: ubuntu-latest
    needs: [android-build, ios-build]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 🌟 改用官方推荐的步骤输出（Outputs）机制提取版本号
      - name: Extract Version
        id: get_version # 必须定义 id，后面的步骤才能找得到它
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 2. 把刚才安卓打包生成的 APK 下载到本地工作区
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android_release_apk
          path: ./downloads

      # 3. 把刚才 iOS 打包生成的 IPA 下载到本地工作区
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios_release_no_sign
          path: ./downloads

      # 4. 一键发布到 GitHub Release（以草稿形式）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          files: ./downloads/**/*
          generate_release_notes: true
          draft: true # 🌟 设为 true，这样运行完后会停留在草稿状态，不会公开
          prerelease: false # 先设为 false，手动发布时可以在网页上勾选是否改为预发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
